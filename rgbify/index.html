<!DOCTYPE html>
<html lang="en">
<head profile="http://www.w3.org/2005/10/profile">
<meta http-equiv="Pragma" content="no-cache">
<!-- Required meta tags -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RGBify</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
	integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
	crossorigin="anonymous" />


<link rel="icon" type="image/x-icon" href="favicon.ico" />

<style>
body {
	background-color: #3f3f3f;
}

/* Center the form vertically/horizontally regardless of aspect ratio or orientation. */
main {
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	min-height: 100dvh;
	padding: 4px 0;
}

#form {
	width: fit-content;
	max-width: 100%;
}

/* Every control row: label left of the control, never wrapping so a fixed-size
   child (mirror, color wheel) can't get squeezed off to the side or clipped.
   Spacing is applied per-row as margin-bottom (margin-top stays 0), so the gap
   below each row is exactly that row's margin — easy to reason about. */
.form-group.row {
	flex-wrap: nowrap;
	align-items: center;
	column-gap: 22px;
	margin: 0 0 0.6rem;
}

/* Hue (color wheel): gap to mirror, balanced by the mirror's own bottom gap so
   the mirror sits centered between the wheel and the Background menu. */
.form-group.row:has(#color-picker-container) {
	margin-bottom: 1rem;
}

/* Mirror: equal gap below so it floats halfway between wheel and Background. */
.form-group.row:has(#screencanvas) {
	margin-bottom: 1rem;
}

/* Background / Ambience / Volume / Tone: pack this cluster tightly. */
.form-group.row:has(#backgroundSelect) {
	margin-bottom: 0.3rem;
}
#ambienceRow {
	margin-bottom: 0.3rem;
}
.form-group.row:has(#volumeRange) {
	margin-bottom: 0.3rem;
}
.form-group.row:has(#toneRange) {
	margin-bottom: 0.3rem;
}

/* Scroller / Blitter / Bluetooth: roomier so text fields and the connect
   action stand out from the packed cluster above them. */
.form-group.row:has(#message),
.form-group.row:has(#bridgeMessage),
.form-group.row:has(#connectButton) {
	margin-bottom: 0.7rem;
}

label {
	width: 115px;
	flex: 0 0 115px;
	display: inline-block;
	text-align: right;
	padding-right: 10px;
	margin-bottom: 0;
	color: #d0d0d0;
	font-size: 1.02rem;
}

/* Control cell: center horizontally, but never flex-stretch children vertically
   (that squishes the mirror), never shrink them below their natural size. */
.form-group.row > div {
	display: flex !important;
	flex: 1 1 auto;
	min-width: 0;
	justify-content: center !important;
	align-items: center !important;
	text-align: center;
}

canvas {
	width: 173px;
}

/* The live mirror must stay square. Its container carries aspect-ratio:1/1;
   the canvas simply fills it (block, no flex-stretch, no auto-height quirk). */
#screencanvas {
	display: block;
	width: 100%;
	height: 100%;
}

/* Text boxes: keep compact so a row fits portrait widths. */
#message,
#bridgeMessage {
	max-width: 100%;
}

/* Connect and Screenshare buttons share an equal fixed width, matching the
   color wheel / mirror / text-field width (173px). */
#connectButton,
#ambienceButton {
	width: 173px;
}

/* Text box placeholder: red while disconnected; light gray when connected (default). */
#message:disabled::placeholder,
#bridgeMessage:disabled::placeholder {
	color: #dc3545;
}

/* Grey out the text box background while disconnected. */
#message:disabled,
#bridgeMessage:disabled {
	background-color: #9e9e9e;
	color: #d0d0d0;
}

/* Standard disabled look for the iro color picker until connected. */
#color-picker-container.disabled {
	opacity: 0.3;
	pointer-events: none;
}

/* Portrait / short screens: compress row spacing and controls so the whole
   control panel fits on one screen without vertical scrolling. */
@media (max-width: 480px), (max-height: 720px) {
	label {
		width: 96px;
		flex-basis: 96px;
		font-size: 0.94rem;
		padding-right: 8px;
	}
	.form-group.row {
		margin-bottom: 0.5rem;
	}
	main {
		align-items: flex-start;
		padding: 6px 0;
	}
}

/* Hard guarantee: on short screens scale the whole panel down so it always fits
   without scrolling (Chrome/Android + Safari support CSS zoom). */
@media (max-height: 760px) {
	#form {
		zoom: 0.96;
	}
}
@media (max-height: 600px) {
	#form {
		zoom: 0.78;
	}
}
</style>

</head>

<body>
	<main role="main" class="container-fluid">
		<form  id="form">
			<!-- Hidden submit button: with more than one text input, the form needs an
			     explicit submit button or Enter stops submitting (implicit submission). -->
			<input type="submit" style="display: none" />

			<!-- Hue color picker -->
			<div class="form-group row">
				<label class="col-form-label">Hue</label>
				<div>
					<div id="color-picker-container"></div>
				</div>
			</div>

			<!-- Live projector matrix display: always visible, mirrors the device's 8x8 output -->
			<div class="form-group row">
				<label class="col-form-label">Mirror</label>
				<div style="position: relative; width: 173px; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; flex: 0 0 auto;">
					<canvas id="screencanvas"
						style="position: relative; z-index: 0; background-color: #000; width: 100%; height: 100%;"></canvas>
					<div id="overlay"
						style="background-size: contain; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>
				</div>
			</div>

			<!-- Background mode (options injected from JS BACKGROUND_MODES) -->
			<div class="form-group row">
				<label class="col-form-label">Background</label>
				<div>
					<select id="backgroundSelect" class="form-control"
						style="width: 173px" disabled></select>
				</div>
			</div>

			<!-- Ambience (screen capture) -->
			<div id="ambienceRow" class="form-group row">
				<label class="col-form-label">Ambience</label>
				<div>
					<button id="ambienceButton" class="btn btn-danger" type="button" disabled>Screenshare</button>
				</div>
			</div>

			<!-- Volume slider -->
			<div class="form-group row">
				<label class="col-form-label">Volume</label>
				<div>
					<input id="volumeRange" class="custom-range" type="range" step="1"
						min="0" max="10" value="0" disabled />
				</div>
			</div>

			<!-- Tone offset slider -->
			<div class="form-group row">
				<label class="col-form-label">Tone</label>
				<div>
					<input id="toneRange" class="custom-range" type="range" step="1"
						min="-424" max="1061" value="0" disabled />
				</div>
			</div>

			<!-- Scroller text -->
			<div class="form-group row">
				<label class="col-form-label">Scroller</label>
				<div>
					<input id="message" class="form-control" style="width: 173px" type="text" maxlength="256" placeholder="Disconnected" disabled>
				</div>
			</div>

			<!-- Blitter text -->
			<div class="form-group row">
				<label class="col-form-label">Blitter</label>
				<div>
					<input id="bridgeMessage" class="form-control" style="width: 173px" type="text" maxlength="256" placeholder="Disconnected" disabled>
				</div>
			</div>

			<!-- Bluetooth connection -->
			<div class="form-group row">
				<label class="col-form-label">Bluetooth</label>
				<div>
					<button id="connectButton" class="btn btn-danger" type="button">Connect</button>
				</div>
			</div>

			<!-- Firmware version (read from DIS) -->
			<div class="form-group row">
				<label class="col-form-label">Firmware</label>
				<div id="firmwareVersion" style="color: #d0d0d0">x.y.z</div>
			</div>

			<!-- Hidden input synced with the iro picker -->
			<div hidden class="form-group row">
				<label class="col-form-label"></label>
				<div>
					<input type="color" id="solidColorInput" value="#000000" />
				</div>
			</div>
			<link rel="alternate" type="application/atom+xml" href="https://mail.google.com/mail/feed/atom" title="swqee news">
		</form>

	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-fQybjgWLrvvRgtW6bFlB7jaZrFsaBXjsOMm/tB9LTS58ONXgqbR9W8oWht/amnpF"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@jaames/iro/dist/iro.min.js"></script>
</body>
<script src="js/rgbify-projector.js?v=0.1.7"></script>
</html>
