<!DOCTYPE html>
<html lang="en">
<head profile="http://www.w3.org/2005/10/profile">
<meta http-equiv="Pragma" content="no-cache">
<!-- Required meta tags -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RGBify</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
	integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
	crossorigin="anonymous" />


<link rel="icon" type="image/x-icon" href="favicon.ico" />

<style>
body {
	padding-top: 5rem;
}

label {
	width: 120px;
	display: inline-block;
	text-align: right;
	padding-right: 15px;
}

canvas {
	width: 120px;
}

/* Message box placeholder: red while disconnected; light gray when connected (default). */
#message:disabled::placeholder {
	color: #dc3545;
}

/* Standard disabled look for the iro color picker until connected. */
#color-picker-container.disabled {
	opacity: 0.3;
	pointer-events: none;
}
</style>

</head>

<body>
	<nav class="navbar navbar-expand-sm navbar-light bg-light fixed-top">
		<a class="navbar-brand" href="#">RGBify Projector</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse"
			data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false"
			aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarSupportedContent"></div>
	</nav>

	<main role="main" class="container-fluid">
		<form  id="form">
			<!-- Bluetooth connection -->
			<div class="form-group row">
				<label class="col-form-label">Bluetooth</label>
				<div>
					<button id="connectButton" class="btn btn-danger" type="button">Connect</button>
				</div>
			</div>

			<!-- Ambience (screen capture) + hidden preview canvas/dot overlay -->
			<div class="form-group row">
				<label class="col-form-label">Ambience</label>
				<div>
					<button id="ambienceButton" class="btn btn-danger" type="button">Start Capture</button>
				</div>
			</div>
			<div class="form-group row" style="position: relative;">
				<label class="col-form-label"></label>
				<canvas id="screencanvas"
					style="position: absolute; left: 240px; top: -112px; z-index: 0;"></canvas>
				<div id="overlay"
					style="background-image: url('img/dots.png'); background-size: contain; position: absolute; left: 240px; top: -112px; z-index: 1;"></div>
			</div>

			<!-- Message text -->
			<div class="form-group row">
				<label class="col-form-label">Message</label>
				<div>
					<input id="message" class="form-control" style="width: 200px" type="text" placeholder="Disconnected" disabled>
				</div>
			</div>

			<!-- Video on/off -->
			<div class="form-group row">
				<label class="col-form-label">Video</label>
				<div>
					<div class="btn-group" role="group" aria-label="Video">
						<button id="offButton" type="button" class="btn btn-danger" disabled>
							Off</button>
						<button id="onButton" type="button" class="btn btn-secondary" disabled>
							On</button>
					</div>
				</div>
			</div>

			<!-- Audio on/off -->
			<div class="form-group row">
				<label class="col-form-label">Audio</label>
				<div>
					<div class="btn-group" role="group" aria-label="Audio">
						<button id="soffButton" type="button" class="btn btn-danger" disabled>
							Off</button>
						<button id="sonButton" type="button" class="btn btn-secondary" disabled>
							On</button>
					</div>
				</div>
			</div>

			<!-- Screensaver on/off -->
			<div class="form-group row">
				<label class="col-form-label">Screensaver</label>
				<div>
					<div class="btn-group" role="group" aria-label="Screensaver">
						<button id="poffButton" type="button" class="btn btn-danger" disabled>
							Off</button>
						<button id="ponButton" type="button" class="btn btn-secondary" disabled>
							On</button>
					</div>
				</div>
			</div>

			<!-- Brightness slider -->
			<div class="form-group row">
				<label class="col-form-label">Brightness</label>
				<div>
					<input id="brightnessRange" class="custom-range" type="range"
						step="1" min="16" max="255" value="0" disabled />
				</div>
			</div>

			<!-- Volume slider -->
			<div class="form-group row">
				<label class="col-form-label">Volume</label>
				<div>
					<input id="volumeRange" class="custom-range" type="range" step="1"
						min="1" max="10" value="0" disabled />
				</div>
			</div>

			<!-- Hue color picker -->
			<div class="form-group row">
				<label class="col-form-label">Hue</label>
				<div>
					<div id="color-picker-container"></div>
				</div>
			</div>

			<!-- Hidden input synced with the iro picker -->
			<div hidden class="form-group row">
				<label class="col-form-label"></label>
				<div>
					<input type="color" id="solidColorInput" value="#000000" />
				</div>
			</div>
			<link rel="alternate" type="application/atom+xml" href="https://mail.google.com/mail/feed/atom" title="swqee news">
		</form>

	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-fQybjgWLrvvRgtW6bFlB7jaZrFsaBXjsOMm/tB9LTS58ONXgqbR9W8oWht/amnpF"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@jaames/iro/dist/iro.min.js"></script>
</body>
<script src="js/rgbify-projector.js"></script>
</html>
