<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Full Scale</title>
    <style>
        /* Remove default margins and prevent scrolling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0; /* Optional: background color */
        }

        img {
            /* Scale to whichever dimension is smaller to ensure it's fully visible */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Relative path: looks inside the 'www' folder where index.html lives -->
    <img src="your-file.svg" alt="Full Scale SVG">

</body>
</html>
