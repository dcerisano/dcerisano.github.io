<!DOCTYPE html>
<html lang="en">
<head profile="http://www.w3.org/2005/10/profile">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Expires" content="0">
<!-- Required meta tags -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blitter</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
	integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
	crossorigin="anonymous" />


<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="manifest" href="manifest.json" />

<style>
body {
	background-color: #3f3f3f;
}

/* Center the form vertically/horizontally regardless of aspect ratio or orientation. */
main {
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	min-height: 100dvh;
	padding: 4px 0;
}

#form {
	width: fit-content;
	max-width: 100%;
}

/* Every control row: label left of the control, never wrapping so a fixed-size
   child (mirror, color wheel) can't get squeezed off to the side or clipped.
   Spacing is applied per-row as margin-bottom (margin-top stays 0), so the gap
   below each row is exactly that row's margin — easy to reason about. */
.form-group.row {
	flex-wrap: nowrap;
	align-items: center;
	column-gap: 22px;
	margin: 0 0 0.6rem;
}

/* Mirror (top row): modest gap down to the color picker. */
.form-group.row:has(#screencanvas) {
	margin-bottom: 0.5rem;
}

/* Background / Volume: pack this cluster tightly. */
.form-group.row:has(#backgroundSelect) {
	margin-bottom: 0.3rem;
}
.form-group.row:has(#volumeRange) {
	margin-bottom: 0.3rem;
}

/* Bluetooth: roomier so the connect action stands out from the packed cluster above. */
.form-group.row:has(#connectButton) {
	margin-bottom: 0.7rem;
}

label {
	width: 115px;
	flex: 0 0 115px;
	display: inline-block;
	text-align: right;
	padding-right: 10px;
	margin-bottom: 0;
	color: #d0d0d0;
	font-size: 1.02rem;
}

/* Control cell: center horizontally, but never flex-stretch children vertically
   (that squishes the mirror), never shrink them below their natural size. */
.form-group.row > div {
	display: flex !important;
	flex: 1 1 auto;
	min-width: 0;
	justify-content: center !important;
	align-items: center !important;
	text-align: center;
}

canvas {
	width: 173px;
}

/* The live mirror must stay square. Its container carries aspect-ratio:1/1;
   the canvas simply fills it (block, no flex-stretch, no auto-height quirk). */
#screencanvas {
	display: block;
	width: 100%;
	height: 100%;
}

/* Clickable mirror: fullscreen uses the plugin wallpaper sizing
   (min(viewport) * 0.7 square, centered on black). */
#mirrorWrap {
	cursor: default;
}
#mirrorWrap:not(.disabled) {
	cursor: pointer;
}
#mirrorWrap:fullscreen,
#mirrorWrap:-webkit-full-screen {
	width: 100vw;
	height: 100vh;
	aspect-ratio: auto;
	border-radius: 0;
	background: #000;
	display: flex;
	align-items: center;
	justify-content: center;
}
#mirrorWrap:fullscreen::backdrop {
	background: #000;
}
#mirrorWrap:fullscreen #screencanvas,
#mirrorWrap:-webkit-full-screen #screencanvas {
	width: 70vmin !important;
	height: 70vmin !important;
	flex: 0 0 auto;
	image-rendering: pixelated;
}
#mirrorWrap:fullscreen #overlay,
#mirrorWrap:-webkit-full-screen #overlay {
	width: 70vmin !important;
	height: 70vmin !important;
	top: 50% !important;
	left: 50% !important;
	transform: translate(-50%, -50%);
}



/* Connect button matches the color wheel / mirror / text-field width (173px). */
#connectButton {
	width: 173px;
}



/* Portrait / short screens: compress row spacing and controls so the whole
   control panel fits on one screen without vertical scrolling. */
@media (max-width: 480px), (max-height: 720px) {
	label {
		width: 96px;
		flex-basis: 96px;
		font-size: 0.94rem;
		padding-right: 8px;
	}
	.form-group.row {
		margin-bottom: 0.5rem;
	}
	main {
		align-items: flex-start;
		padding: 6px 0;
	}
}

/* Hard guarantee: on short screens scale the whole panel down so it always fits
   without scrolling (Chrome/Android + Safari support CSS zoom). */
@media (max-height: 760px) {
	#form {
		zoom: 0.96;
	}
}
@media (max-height: 600px) {
	#form {
		zoom: 0.78;
	}
}
</style>

</head>

<body>
	<main role="main" class="container-fluid">
		<form  id="form">
			<!-- Hidden submit button: with more than one text input, the form needs an
			     explicit submit button or Enter stops submitting (implicit submission). -->
			<input type="submit" style="display: none" />

			<!-- Live Blitter matrix display: always visible, mirrors the device's 8x8 output.
			     Click toggles fullscreen (plugin wallpaper sizing: 70% of viewport min). -->
			<div class="form-group row">
				<label class="col-form-label">Mirror</label>
				<div id="mirrorWrap" class="disabled" style="position: relative; width: 173px; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; flex: 0 0 auto;">
					<img src="img/tv.png" alt="TV" style="position: absolute; top: 0; left: 0; width: 173px; height: 173px; z-index: -1; object-fit: contain;" />
					<canvas id="screencanvas"
						style="position: relative; z-index: 0; background-color: #000; width: 100%; height: 100%; transform: scale(0.8); transform-origin: center center;"></canvas>
					<div id="overlay"
						style="background-size: contain; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transform: scale(0.81); transform-origin: center center;"></div>
					<img src="img/tv-glass.png" alt="TV Glass" style="position: absolute; top: 0; left: 0; width: 173px; height: 173px; z-index: 2; object-fit: contain; pointer-events: none;" />
				</div>
			</div>

			<!-- Background mode (options injected from JS BACKGROUND_MODES) -->
			<div class="form-group row">
				<label class="col-form-label">Background</label>
				<div>
					<select id="backgroundSelect" class="form-control"
						style="width: 173px" disabled></select>
				</div>
			</div>

			<!-- Volume slider -->
			<div class="form-group row">
				<label class="col-form-label">Volume</label>
				<div>
					<input id="volumeRange" class="custom-range" type="range" step="1"
						min="0" max="10" value="0" disabled />
				</div>
			</div>

			<!-- Bluetooth connection -->
			<div class="form-group row">
				<label class="col-form-label">Bluetooth</label>
				<div>
					<button id="connectButton" class="btn btn-danger" type="button">Connect</button>
				</div>
			</div>


			<!-- Firmware version (read from DIS) -->
			<div class="form-group row">
				<label class="col-form-label">Firmware</label>
				<div id="firmwareVersion" style="color: #d0d0d0">x.y.z</div>
			</div>

			<link rel="alternate" type="application/atom+xml" href="https://mail.google.com/mail/feed/atom" title="swqee news">
		</form>

	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-fQybjgWLrvvRgtW6bFlB7jaZrFsaBXjsOMm/tB9LTS58ONXgqbR9W8oWht/amnpF"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/@jaames/iro/dist/iro.min.js"></script>
</body>
<script src="js/blitter.js?v=8e88112"></script>
</html>
